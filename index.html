<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Navigators</title>
<meta name="author" content="Laurence F. White">
<meta name="copyright" content="Copyright 2026 Laurence F. White">
<meta name="description" content="A globe of the great journeys by sea, over land and across the ice: each route draws itself day by day, with the travellers' own words at the turns of the story.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Spectral:ital,wght@0,300;0,400;1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060c;
  --panel:rgba(13,18,29,.86);
  --panel-brd:rgba(255,255,255,.10);
  --ink:#e9eef7;
  --ink-dim:#9aa8c0;
  --ink-faint:#6c7a93;
  --accent:#8ed0ff;
  --shadow:0 18px 50px -12px rgba(0,0,0,.75);
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --clock-h:112px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;inset:0}
canvas.layer{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#gl{pointer-events:none}
#globe{cursor:grab}
#globe.dragging{cursor:grabbing}
#globe.over{cursor:pointer}
button{font:inherit;color:inherit}
.panel{position:absolute;z-index:2;background:var(--panel);border:1px solid var(--panel-brd);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

#brand{position:absolute;left:20px;top:16px;z-index:2;pointer-events:none}
#brand h1{margin:0;font-family:var(--serif);font-weight:300;font-size:26px;letter-spacing:.02em}
#brand p{margin:2px 0 0;color:var(--ink-faint);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}

#list{left:16px;top:74px;width:272px;bottom:calc(var(--clock-h) + 26px);display:flex;flex-direction:column;overflow:hidden}
#list .head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
#list .head span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
#list .scroll{overflow:auto;padding:0 6px 10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
#list .tools{padding:0 12px 6px;display:flex;flex-direction:column;gap:7px}
#q{width:100%;box-sizing:border-box;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 9px;color:var(--ink);font:inherit;font-size:12.5px;outline:none}
#q:focus{border-color:rgba(142,208,255,.5)}
#q::placeholder{color:var(--ink-faint)}
#list .tabs{display:flex;gap:4px}
#list .tabs .chip{flex:1;text-align:center}
#list .none{padding:10px 10px;color:var(--ink-faint);font-size:12px}
.jrow{position:relative}
.jrow .add{position:absolute;right:6px;top:7px;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;color:var(--ink-faint);border:1px solid rgba(255,255,255,.12);background:rgba(10,14,24,.6);opacity:0}
.jrow:hover .add,.jrow.on .add{opacity:1}
.jrow .add:hover{color:var(--ink);border-color:rgba(142,208,255,.5)}
.jrow b{padding-right:20px}
#list h3{margin:12px 8px 4px;font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.jrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:7px 8px;cursor:pointer}
.jrow:hover{background:rgba(255,255,255,.06)}
.jrow.on{background:rgba(255,255,255,.10)}
.jrow .sw{flex:none;width:10px;height:10px;border-radius:50%;margin-top:4px;box-shadow:0 0 8px currentColor}
.jrow .sw.pair{width:16px;border-radius:5px}
.jrow b{display:block;font-weight:500;font-size:13px;line-height:1.3}
.jrow small{display:block;color:var(--ink-dim);font-size:11.5px;margin-top:1px}
.chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:4px 9px;font-size:11.5px;color:var(--ink-dim);cursor:pointer}
.chip:hover{background:rgba(255,255,255,.12);color:var(--ink)}
.chip.on{color:var(--ink);border-color:rgba(142,208,255,.5);background:rgba(142,208,255,.12)}

#card{right:16px;top:16px;width:360px;max-height:calc(100% - var(--clock-h) - 42px);overflow:auto;padding:16px 18px 14px;display:none;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
#card.show{display:block}
#card .close{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--ink-faint);cursor:pointer;font-size:14px;line-height:1}
#card .close:hover{color:var(--ink);background:rgba(255,255,255,.12)}
.kicker{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
#card h2{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.2;margin:4px 30px 4px 0}
#card .who{color:var(--ink-dim);font-size:12.5px}
#card .facts{color:var(--ink-dim);font-size:12px;margin-top:6px}
.status{margin:12px 0 0;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:12.5px;line-height:1.45}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.status em{font-style:normal;color:var(--ink-dim)}
.story{margin-top:14px;border-left:2px solid var(--story,#8ed0ff);padding:2px 0 2px 12px}
.story .sd{font-size:11px;color:var(--ink-faint);letter-spacing:.04em}
.story h4{margin:2px 0 6px;font-family:var(--serif);font-weight:400;font-size:17px}
.story blockquote{margin:0 0 6px;font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.5;color:#f3eee2}
.story .src{font-size:11px;color:var(--ink-faint)}
.story p{margin:6px 0 0;line-height:1.5;color:var(--ink-dim)}
.storynav{display:flex;gap:6px;margin-top:10px}
.claim{margin-top:12px;padding:9px 11px;border-radius:10px;border:1px dashed rgba(255,214,120,.45);background:rgba(255,214,120,.06);font-size:12.5px;line-height:1.45}
.claim b{color:#ffd678;font-weight:500}
#card .summary{margin:14px 0 0;line-height:1.55;color:var(--ink)}
#card details{margin-top:12px;color:var(--ink-dim);font-size:12px}
#card summary{cursor:pointer;color:var(--ink-faint);letter-spacing:.04em}
#card details ul{margin:6px 0 0;padding-left:18px}
#card details li{margin:3px 0}
#card a{color:var(--accent);text-decoration:none}
#card a:hover{text-decoration:underline}
.links{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px}
.pairhead{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pairhead .chip{display:inline-flex;align-items:center;gap:5px}
.pairhead .chip i{font-style:normal;color:var(--ink-faint);padding:0 2px;margin-left:2px}
.pairhead .chip i:hover{color:var(--ink)}
.seg{display:flex;gap:4px;margin-top:8px}
.feed{margin-top:14px}
.feed h5{margin:0 0 4px;font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.feedrow{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:5px 6px;cursor:pointer;color:var(--ink-dim);font-size:12px;line-height:1.35}
.feedrow:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.feedrow .dot{flex:none;width:7px;height:7px;border-radius:50%;transform:translateY(-1px)}
.feedrow small{flex:none;color:var(--ink-faint);font-size:11px;min-width:74px}
.story .by{font-size:11px;letter-spacing:.04em;margin-bottom:2px}
#card h3.sub{font-family:var(--serif);font-weight:400;font-size:17px;margin:16px 0 2px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}

#clock{left:16px;right:16px;bottom:16px;height:var(--clock-h);display:flex;align-items:stretch;gap:14px;padding:12px 16px}
#list h3.fold{cursor:pointer;user-select:none}
#list h3.fold:hover{color:var(--ink)}
#list h3.fold span{color:var(--ink-faint);opacity:.7;margin-left:4px}
#date small{overflow:hidden;text-overflow:ellipsis;max-width:100%}
#clock .left{flex:none;width:230px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
#play{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);cursor:pointer;display:flex;align-items:center;justify-content:center}
#play:hover{background:rgba(255,255,255,.14)}
#play svg{width:16px;height:16px;fill:var(--ink)}
#date{font-family:var(--serif);font-size:21px;font-weight:300;white-space:nowrap}
#date small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px}
#scrub{flex:1;position:relative;min-width:0}
#scrub canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;touch-action:none}
#clock .right{flex:none;display:flex;flex-direction:column;justify-content:center;gap:6px;align-items:flex-end}
select.chip{appearance:none;-webkit-appearance:none;padding-right:20px;background-image:linear-gradient(45deg,transparent 50%,#9aa8c0 50%),linear-gradient(135deg,#9aa8c0 50%,transparent 50%);background-position:calc(100% - 10px) 50%,calc(100% - 6px) 50%;background-size:4px 4px;background-repeat:no-repeat}
select.chip option{background:#111827;color:var(--ink)}

#views{position:absolute;right:16px;bottom:calc(var(--clock-h) + 28px);z-index:2;display:flex;flex-direction:column;gap:6px}
body.carded #views{right:392px}
#views .chip{text-align:center}
#legend{position:absolute;left:304px;bottom:calc(var(--clock-h) + 28px);z-index:2;font-size:11px;color:var(--ink-faint);display:flex;gap:14px;align-items:center;pointer-events:none}
#legend svg{vertical-align:middle;margin-right:5px}
#legend .sep{margin-left:8px;color:var(--ink-dim)}
#plates{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.plate{position:absolute;margin:0;transform:translate(-50%,-50%);display:none;filter:drop-shadow(0 6px 24px rgba(0,0,0,.6))}
.plate img{display:block;width:100%;border-radius:4px;border:1px solid rgba(255,255,255,.25)}
.plate figcaption{margin-top:5px;font-size:11px;color:var(--ink-dim);text-shadow:0 1px 3px #000;text-align:center}
.pmaps{margin-top:14px}
.pmaps h5{margin:0 0 6px;font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.pmap{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:6px 7px;cursor:pointer;color:var(--ink-dim);font-size:12px;line-height:1.35}
.pmap:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.pmap.on{border-color:rgba(142,208,255,.4);background:rgba(142,208,255,.08);color:var(--ink)}
.pmap .box{flex:none;width:11px;height:11px;border-radius:3px;border:1px solid rgba(255,255,255,.35);margin-top:2px}
.pmap.on .box{background:var(--accent);border-color:var(--accent)}
.pmap small{display:block;color:var(--ink-faint);font-size:11px}
.pnote{margin:2px 0 6px 26px;font-size:11.5px;line-height:1.45;color:var(--ink-dim)}
.pnote a{font-size:11px}
.fade{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-size:11px;color:var(--ink-faint)}
.fade input{flex:1;accent-color:#8ed0ff}
#tip{position:absolute;z-index:4;pointer-events:none;background:rgba(10,14,24,.92);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 9px;font-size:12px;display:none;max-width:280px;line-height:1.4}
#tip small{color:var(--ink-dim)}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:12px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;z-index:1}
#credit{position:absolute;right:18px;top:auto;bottom:4px;z-index:1;font-size:10px;color:#4a566c;pointer-events:none}

#menu{display:none}
@media (max-width:820px){
  :root{--clock-h:118px}
  #brand h1{font-size:20px}
  #brand p{display:none}
  #list{display:none;top:56px;left:8px;right:8px;width:auto;bottom:calc(var(--clock-h) + 20px)}
  #list.open{display:flex}
  #menu{display:block;position:absolute;right:12px;top:12px;z-index:3}
  #card{left:8px;right:8px;top:auto;bottom:calc(var(--clock-h) + 20px);width:auto;max-height:46%}
  #clock{left:8px;right:8px;bottom:8px;flex-wrap:wrap;gap:6px;padding:8px 10px}
  #clock .left{width:auto;flex-direction:row;align-items:center}
  #clock .right{flex-direction:row}
  #scrub{flex-basis:100%;height:48px;order:3}
  #legend,#views{display:none}
  #credit{display:none}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" class="layer"></canvas>
  <canvas id="globe" class="layer"></canvas>
  <div id="loading">Loading the globe</div>
</div>
<div id="brand"><h1>Navigators</h1><p>Great journeys by sea, over land and across the ice</p></div>
<button id="menu" class="chip">Journeys</button>
<div id="list" class="panel">
  <div class="head"><span>Journeys</span><button id="all" class="chip">Show all</button></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search journeys, people, places" aria-label="Search journeys" autocomplete="off">
    <div class="tabs"><button class="chip on" data-order="region">By region</button><button class="chip" data-order="date">By date</button></div>
  </div>
  <div class="scroll" id="jlist"></div>
</div>
<div id="card" class="panel"></div>
<div id="views">
  <button class="chip" id="music" title="Quiet generative music">Music</button>
  <button class="chip" id="sfx" title="Sea, wind and birds as the journey runs">Sound effects</button>
  <button class="chip on" data-view="follow" title="Keep the travellers in the middle of the view">Follow</button>
  <button class="chip" data-view="fit">Fit journey</button>
  <button class="chip" data-view="north">North Pole</button>
  <button class="chip" data-view="south">South Pole</button>
</div>
<div id="legend">
  <span><svg width="26" height="6"><line x1="1" y1="3" x2="25" y2="3" stroke="#cfd8e6" stroke-width="2"/></svg>Logged or fixed</span>
  <span><svg width="26" height="6"><line x1="1" y1="3" x2="25" y2="3" stroke="#cfd8e6" stroke-width="2" stroke-dasharray="6 4"/></svg>Reconstructed</span>
  <span><svg width="26" height="6"><line x1="1" y1="3" x2="25" y2="3" stroke="#cfd8e6" stroke-width="2" stroke-dasharray="1.5 4" stroke-linecap="round" opacity=".7"/></svg>Inferred</span>
  <span class="sep">Timeline:</span>
  <span><svg width="22" height="9"><rect x="1" y="1" width="20" height="7" fill="#cfd8e6" opacity=".9"/></svg>Under way</span>
  <span><svg width="22" height="9"><defs><pattern id="lgh" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="rgba(255,255,255,.5)" stroke-width="1"/></pattern></defs><rect x="1" y="1" width="20" height="7" fill="#cfd8e6" opacity=".35"/><rect x="1" y="1" width="20" height="7" fill="rgba(8,12,22,.55)"/><rect x="1" y="1" width="20" height="7" fill="url(#lgh)"/></svg>Held in one place two weeks or more</span>
  <span><svg width="10" height="10"><rect x="2.5" y="2.5" width="5" height="5" fill="#fff" stroke="#cfd8e6" transform="rotate(45 5 5)"/></svg>Story</span>
</div>
<div id="clock" class="panel">
  <div class="left">
    <div class="row"><button id="play" aria-label="Play"><svg viewBox="0 0 16 16"><path id="playicon" d="M4 2.5v11l9-5.5z"/></svg></button>
    <div id="date">–<small>&nbsp;</small></div></div>
  </div>
  <div id="scrub"><canvas id="scrubcv"></canvas></div>
  <div class="right">
    <select id="speed" class="chip" aria-label="Speed">
      <option value="1">1 day a second</option>
      <option value="7">1 week a second</option>
      <option value="30" selected>1 month a second</option>
      <option value="365">1 year a second</option>
    </select>
    <button id="adaptive" class="chip" title="Run quickly through spans where nobody is moving">Adaptive speed</button>
    <button id="stories" class="chip" title="Stop the clock when a journey reaches a story">Stop at stories</button>
  </div>
</div>
<div id="plates"></div>
<div id="tip"></div>
<div id="credit">© 2026 Laurence F. White · Natural Earth</div>

<script src="lib/globe-libs.js"></script>
<script src="lib/globe-gl.js"></script>
<script src="lib/sound.js"></script>
<script src="data/base.js"></script>
<script src="data/journeys.js"></script>
<script src="data/maps.js"></script>
<script>
(function () {
'use strict';
var DEG = Math.PI / 180, DAY = 86400000;
var B = window.NAV_BASE, JD = window.NAV_JOURNEYS;
var JOURNEYS = JD.journeys, BYID = {};
JOURNEYS.forEach(function (j) { BYID[j.id] = j; prep(j); });
var GROUPS = JD.groups, SETS = JD.sets;

/* ------------------------------------------------------------ journeys */
function prep(j) {
  j.ll = j.pts.map(function (p) { return [p[0], p[1]]; });
  j.t0 = j.pts.length ? j.pts[0][2] : day(j.start);
  j.t1 = j.pts.length ? j.pts[j.pts.length - 1][2] : day(j.end);
  j.ta = Math.min(j.t0, day(j.start)); j.tb = Math.max(j.t1, day(j.end) + 1);
  /* the middle of the route and how far it reaches from it, for fitting the view */
  var sx = 0, sy = 0, sz = 0;
  j.xyz = j.ll.map(function (p) { var u = unitv(p); sx += u[0]; sy += u[1]; sz += u[2]; return u; });
  var m = Math.hypot(sx, sy, sz) || 1, c = [sx / m, sy / m, sz / m], far = 0;
  j.xyz.forEach(function (u) { far = Math.max(far, Math.acos(Math.max(-1, Math.min(1, u[0] * c[0] + u[1] * c[1] + u[2] * c[2])))); });
  j.centre = [Math.atan2(c[1], c[0]) / DEG, Math.asin(c[2]) / DEG]; j.reach = far;
  j.rgb = d3.rgb(j.colour);
}
function day(s) { var a = s.replace(/^-/, '').split('-').map(Number); if (s.charAt(0) === '-') a[0] = -a[0]; var d = new Date(Date.UTC(2000, a[1] - 1, a[2])); d.setUTCFullYear(a[0]); return Math.round(d.getTime() / DAY); }
var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function dateOf(t) { return new Date(Math.floor(t) * DAY); }
function fmt(t, short) {
  var d = dateOf(t), m = MONTHS[d.getUTCMonth()];
  return d.getUTCDate() + ' ' + (short ? m.slice(0, 3) : m) + ' ' + yr(d.getUTCFullYear());
}
/* years BC are astronomical in the data: 0 is 1 BC, -332 is 333 BC */
function yr(y) { return y > 0 ? String(y) : (1 - y) + ' BC'; }
function yearOf(s) { return dateOf(day(s)).getUTCFullYear(); }
function isoOf(t) { var d = dateOf(t), y = d.getUTCFullYear(), p = function (n) { return (n < 10 ? '0' : '') + n; }; return (y < 0 ? '-' : '') + ('000' + Math.abs(y)).slice(-4) + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()); }
function fmtIso(s) { return fmt(day(s)); }
function unitv(ll) { var l = ll[0] * DEG, p = ll[1] * DEG, cp = Math.cos(p); return [cp * Math.cos(l), cp * Math.sin(l), Math.sin(p)]; }
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* where a journey is at time t: the index of the last point passed, the position, and whether it is held */
function stateAt(j, t) {
  var P = j.pts, n = P.length;
  if (!n) return null;
  if (t < P[0][2]) return { i: -1, ll: j.ll[0], before: true };
  if (t >= P[n - 1][2]) return { i: n - 1, ll: j.ll[n - 1], after: true, km: P[n - 1][4] };

  active.forEach(function (j) { j.calls.forEach(function (c) { if (Math.abs(tx(c.t - off(j)) - x) < 5) { now = c.t - off(j); openStory(j, c); } }); });
  tickUI();
});
function scrubTo(e) {
  var r = scrubCv.getBoundingClientRect();
  now = xt(e.clientX - r.left);
  lastStoryCheck = now;
  tickUI();
}

var playLast = 0, lastStoryCheck = 0;
function startPlay() {
  if (!active.length) return;
  if (now >= T1 - 0.5) now = T0;
  playing = true; playLast = performance.now(); lastStoryCheck = now;
  document.getElementById('playicon').setAttribute('d', 'M4 2.5h3v11H4zM9 2.5h3v11H9z');
  scheduleDraw();
}
function stopPlay() {
  playing = false;
  document.getElementById('playicon').setAttribute('d', 'M4 2.5v11l9-5.5z');
}
/* the clock runs at the chosen rate; with adaptive speed on, quickly through spans where nobody is moving:
   a winter in quarters, the months before the second party sets out */
function anyMoving(t) {
  for (var i = 0; i < active.length; i++) {
    var j = active[i];
    var u = t + off(j);
    if (u < j.t0 || u >= j.t1) continue;
    var held = false;
    for (var k = 0; k < j.held.length; k++) if (u >= j.held[k].a && u < j.held[k].b) { held = true; break; }
    if (!held) return true;
  }
  return false;
}
function stepPlay(t) {
  var dt = Math.min(0.1, (t - playLast) / 1000); playLast = t;
  var r = rate * (!adaptive || anyMoving(now) ? 1 : Math.max(8, 240 / rate));
  var next = now + r * dt;
  /* never step over a story */
  var hit = null;
  active.forEach(function (j) { var o = off(j); j.calls.forEach(function (c) { if (c.t - o > now && c.t - o <= next && (!hit || c.t - o < hit.t)) hit = { j: j, c: c, t: c.t - o }; }); });
  if (hit) {
    now = hit.t;
    openStory(hit.j, hit.c);
    if (window.NVSound) NVSound.cue('story');
    if (stopAtStories) stopPlay();
  } else now = next;
  if (now >= T1) { now = T1; stopPlay(); }
  tickUI(true);
  return playing;
}
var lastFeed = '';
function feedKey() { var n = 0; active.forEach(function (j) { j.calls.forEach(function (c) { if (c.t <= jt(j) + 0.01) n++; }); }); return active.map(function (j) { return j.id; }).join() + n + (story && story.c ? story.c.title : ''); }
function T0s() { return Math.min.apply(null, active.map(function (j) { return j.t0 - off(j); })); }
function tickUI(fromPlay) {
  var d = document.getElementById('date');
  if (active.length) {
    var sub = '';
    var lead = focus || active[0], lt = jt(lead);
    if (aligned()) d.innerHTML = 'Day ' + Math.max(1, Math.floor(now - T0s() + 1)) + '<small>Each journey from its own first day</small>';
    else {
      if (lt < lead.t0) sub = 'Before setting out';
      else if (lt > lead.t1) sub = 'After the journey';
      else sub = 'Day ' + Math.floor(lt - lead.t0 + 1) + ' of ' + shortName(lead);
      d.innerHTML = esc(fmt(now)) + '<small>' + esc(sub) + (dateOf(now).getUTCFullYear() < 1 ? ' · dates approximate' : dateOf(now).getUTCFullYear() < 1582 ? ' · Julian calendar' : '') + '</small>';
    }
  } else d.innerHTML = 'All journeys<small>' + JOURNEYS.length + ' routes</small>';
  drawScrub();
  renderStatus();
  if (active.length > 1 && cardOpen()) { var fk = feedKey(); if (fk !== lastFeed) { lastFeed = fk; renderCard(); } }
  if (!fromPlay) { updateHash(); scheduleDraw(); }
  else if (Math.random() < 0.05) updateHash();
}
document.getElementById('play').addEventListener('click', function () { if (playing) stopPlay(); else startPlay(); });
document.getElementById('speed').addEventListener('change', function (e) { rate = +e.target.value; });
document.getElementById('adaptive').addEventListener('click', function (e) { adaptive = !adaptive; e.currentTarget.classList.toggle('on', adaptive); });
document.getElementById('stories').addEventListener('click', function (e) { stopAtStories = !stopAtStories; e.currentTarget.classList.toggle('on', stopAtStories); });
document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); if (playing) stopPlay(); else startPlay(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    var s = e.key === 'ArrowRight' ? 1 : -1, step = e.shiftKey ? rate * 10 : rate;
    now = clamp(now + s * step, T0, T1); tickUI();
  } else if (e.key === 'Escape') { if (cardOpen()) closeCard(); }
});

/* ------------------------------------------------------------ list */
var listOrder = 'region', query = '', showSets = false;
function hay(j) {
  if (!j.hay) j.hay = [j.title, j.leader, j.party, j.summary, j.calls.map(function (c) { return c.title; }).join(' '),
    j.pts.map(function (p) { return p[5]; }).join(' ')].join(' ').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return j.hay;
}
function jrow(j) {
  var on = active.indexOf(j) >= 0, many = active.length > 0 && !(active.length === 1 && on);
  return '<button class="jrow' + (on ? ' on' : '') + '" data-id="' + j.id + '"><span class="sw" style="background:' + j.colour + ';color:' + j.colour + '"></span><span><b>' + esc(j.title) + '</b><small>' + esc(j.leader) + ' · ' + years(j) + '</small></span>' +
    '<span class="add" data-add="' + j.id + '" title="' + (on ? 'Take off the clock' : many ? 'Run alongside the journeys on the clock' : 'Run alongside another journey') + '">' + (on && active.length > 1 ? '−' : '+') + '</span></button>';
}
function century(y) { return y <= 0 ? Math.floor((1 - y) / 100) * 100 + 's BC' : y < 1000 ? 'Before 1000' : Math.floor(y / 100) * 100 + 's'; }
function renderList() {
  var h = [], q = query.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  var js = JOURNEYS.filter(function (j) { return !q || q.split(/\s+/).every(function (w) { return hay(j).indexOf(w) >= 0; }); });
  if (!q && SETS.length) {
    var setsOpen = showSets;
    h.push('<h3 class="fold" data-fold="1">' + (setsOpen ? '▾' : '▸') + ' Side by side <span>' + SETS.length + '</span></h3>');
    if (setsOpen) SETS.forEach(function (s) {
      var sj = s.ids.map(function (i) { return BYID[i]; });
      var stops = sj.map(function (x, k) { return x.colour + ' ' + (k * 100 / sj.length) + '% ' + ((k + 1) * 100 / sj.length) + '%'; }).join(',');
      h.push('<button class="jrow' + (activeSet === s ? ' on' : '') + '" data-set="' + s.id + '"><span class="sw pair" style="background:linear-gradient(90deg,' + stops + ');color:' + sj[0].colour + '"></span><span><b>' + esc(s.title) + '</b><small>' + sj.map(shortName).join(', ') + (s.align ? ' · from the same start' : ' · ' + yr(yearOf(sj[0].start)) + '–' + yr(yearOf(sj[sj.length - 1].end))) + '</small></span></button>');
    });
  }
  if (!js.length) h.push('<div class="none">No journey matches “' + esc(query) + '”.</div>');
  else if (listOrder === 'date') {
    var last = null;
    js.slice().sort(function (a, b) { return a.t0 - b.t0; }).forEach(function (j) {
      var c = century(yearOf(j.start));
      if (c !== last) { h.push('<h3>' + c + '</h3>'); last = c; }
      h.push(jrow(j));
    });
  } else GROUPS.forEach(function (g) {
    var gj = js.filter(function (j) { return j.group === g.id; });
    if (!gj.length) return;
    h.push('<h3>' + esc(g.name) + '</h3>');
    gj.forEach(function (j) { h.push(jrow(j)); });
  });
  document.getElementById('jlist').innerHTML = h.join('');
}
document.getElementById('q').addEventListener('input', function (e) { query = e.target.value; renderList(); });
document.querySelector('#list .tabs').addEventListener('click', function (e) {
  var b = e.target.closest('[data-order]'); if (!b) return;
  listOrder = b.dataset.order;
  this.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c === b); });
  renderList();
});
document.getElementById('jlist').addEventListener('click', function (e) {
  if (e.target.closest('[data-fold]')) { showSets = !showSets; renderList(); return; }
  var b = e.target.closest('.jrow'); if (!b) return;
  var add = e.target.closest('[data-add]');
  if (b.dataset.set) selectSet(b.dataset.set);
  else if (add || e.ctrlKey || e.metaKey || e.shiftKey) toggleJourney(b.dataset.id);
  else selectJourney(b.dataset.id);
  if (narrow) document.getElementById('list').classList.remove('open');
});
document.getElementById('all').addEventListener('click', function () { showAll(); flyTo([-20, -5], 1); });
document.getElementById('menu').addEventListener('click', function () { document.getElementById('list').classList.toggle('open'); });
document.getElementById('views').addEventListener('click', function (e) {
  var v = e.target.dataset.view; if (!v) return;
  if (v === 'follow') { follow = !follow; showFollow(); scheduleDraw(); return; }
  follow = false; showFollow();
  if (v === 'north') flyTo([rotation[0], -90], Math.max(zoom, 1.4));
  else if (v === 'south') flyTo([rotation[0], 90], Math.max(zoom, 1.4));
  else if (active.length) fitTo(active);
  else flyTo([-20, -5], 1);
});

/* ------------------------------------------------------------ card */
var cardEl = document.getElementById('card');
function closeCard() { cardEl.classList.remove('show'); resize(); }
function openStory(j, c) {
  if (active.length < 2 || active.indexOf(j) < 0) focus = j;
  story = { j: j, c: c };
  renderCard();
  scheduleDraw();
}
function renderCard() {
  var j = focus;
  if (!j) { cardEl.classList.remove('show'); return; }
  var was = cardOpen();
  var grp = GROUPS.filter(function (g) { return g.id === j.group; })[0];
  var h = ['<button class="close" aria-label="Close">×</button>'];
  var multi = active.length > 1 && active.indexOf(j) >= 0;
  if (multi) {
    h.push('<div class="kicker">' + esc(activeSet ? activeSet.title : active.length + ' journeys side by side') + '</div>');
    h.push('<div class="pairhead">' + active.map(function (x) {
      return '<span role="button" tabindex="0" class="chip' + (x === j ? ' on' : '') + '" data-focus="' + x.id + '"><span style="color:' + x.colour + '">●</span> ' + esc(shortName(x)) + '<i data-drop="' + x.id + '" title="Take off the clock">×</i></span>';
    }).join('') + '</div>');
    h.push('<div class="seg"><button class="chip' + (align ? '' : ' on') + '" data-align="0" title="Each journey at its own dates">Real dates</button><button class="chip' + (align ? ' on' : '') + '" data-align="1" title="Start every journey on the same day, to compare their pace">Same start day</button></div>');
    h.push(feedHtml());
    h.push('<h3 class="sub">' + esc(j.title) + '</h3>');
  } else {
    h.push('<div class="kicker">' + esc(grp ? grp.name : '') + '</div>');
    h.push('<h2>' + esc(j.title) + '</h2>');
  }
  h.push('<div class="who">' + esc(j.leader) + (j.party ? ' · ' + esc(j.party) : '') + '</div>');
  h.push('<div class="facts">' + esc(fmtIso(j.start)) + ' – ' + esc(fmtIso(j.end)) + ' · about ' + j.km.toLocaleString('en-AU') + ' km traced</div>');
  h.push('<div class="status" id="status"></div>');
  if (!multi && story && story.j === j && story.c) {
    var c = story.c, src = srcOf(j, c.src), k = j.calls.indexOf(c);
    h.push('<div class="story" style="--story:' + j.colour + '"><div class="sd">' + esc(fmtIso(c.d)) + '</div><h4>' + esc(c.title) + '</h4>' +
      (c.quote ? '<blockquote>“' + esc(c.quote) + '”</blockquote><div class="src">' + esc(c.who || '') + (src ? ' · ' + srcLink(src) : '') + '</div>' : '') +
      (c.text ? '<p>' + esc(c.text) + '</p>' : '') + (!c.quote && src ? '<div class="src" style="margin-top:6px">' + srcLink(src) + '</div>' : '') + '</div>');
    h.push('<div class="storynav">' + (k > 0 ? '<button class="chip" data-story="' + (k - 1) + '">‹ Previous story</button>' : '') +
      (k < j.calls.length - 1 ? '<button class="chip" data-story="' + (k + 1) + '">Next story ›</button>' : '') + '</div>');
  }
  if (story && story.j === j && story.claim) {
    var cl = story.claim, s2 = srcOf(j, cl.src);
    h.push('<div class="claim"><b>Claimed:</b> ' + esc(cl.claim) + '<br><b>Disputed:</b> ' + esc(cl.dispute) + (s2 ? '<br><span style="color:var(--ink-faint);font-size:11px">' + srcLink(s2) + '</span>' : '') + '</div>');
  }
  h.push('<p class="summary">' + esc(j.summary) + '</p>');
  h.push(mapsHtml(j));
  if (!multi && j.calls.length && !(story && story.j === j)) h.push('<div class="storynav"><button class="chip" data-story="0">Read the stories (' + j.calls.length + ')</button></div>');
  if (j.links.length) h.push('<div class="links">' + j.links.map(function (l) { return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>'; }).join('') + '</div>');
  h.push('<details><summary>Sources and how the route was drawn</summary><ul>' + j.sources.map(function (s) { return '<li>' + srcLink(s) + '</li>'; }).join('') + '</ul>' +
    '<p style="line-height:1.5">A solid line is a position logged or fixed at the time; dashed, placed by later historians from the record; dotted, inferred between known places.' +
    (j.start.charAt(0) === '-' ? ' Ancient dates are approximate, given on the Julian calendar run backwards.' : j.start < '1582' ? ' Dates are Julian, as the sources give them.' : '') + '</p></details>');
  cardEl.innerHTML = h.join('');
  cardEl.classList.add('show');
  renderStatus();
  if (!was) resize();
}
/* side by side, the stories reached so far on every journey, newest first */
function feedHtml() {
  var got = [];
  active.forEach(function (j) { j.calls.forEach(function (c, k) { if (c.t <= jt(j) + 0.01) got.push({ j: j, c: c, k: k, t: c.t - off(j) }); }); });
  got.sort(function (a, b) { return b.t - a.t; });
  var h = ['<div class="feed">'];
  if (!got.length) { h.push('<h5>Stories</h5><div style="color:var(--ink-faint);font-size:12px">The stories appear here as each journey reaches them.</div></div>'); return h.join(''); }
  var top = story && story.c && got.filter(function (g) { return g.c === story.c; })[0] || got[0];
  var c = top.c, j = top.j, src = srcOf(j, c.src);
  h.push('<div class="story" style="--story:' + j.colour + ';margin-top:0"><div class="by" style="color:' + j.colour + '">' + esc(shortName(j)) + '</div><div class="sd">' + esc(fmtIso(c.d)) + '</div><h4>' + esc(c.title) + '</h4>' +
    (c.quote ? '<blockquote>“' + esc(c.quote) + '”</blockquote><div class="src">' + esc(c.who || '') + (src ? ' · ' + srcLink(src) : '') + '</div>' : '') +
    (c.text ? '<p>' + esc(c.text) + '</p>' : '') + '</div>');
  var rest = got.filter(function (g) { return g !== top; }).slice(0, 10);
  if (rest.length) {
    h.push('<h5 style="margin-top:12px">Earlier stories</h5>');
    rest.forEach(function (g) {
      h.push('<button class="feedrow" data-feed="' + g.j.id + '|' + g.k + '"><span class="dot" style="background:' + g.j.colour + '"></span><small>' + esc(fmt(g.c.t, true)) + '</small><span>' + esc(g.c.title) + '</span></button>');
    });
  }
  h.push('</div>');
  return h.join('');
}
function srcOf(j, id) { return j.sources.filter(function (s) { return s.id === id; })[0]; }
function srcLink(s) { return s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title) + '</a>' : esc(s.title); }
function renderStatus() {
  var el = document.getElementById('status'); if (!el || !focus) return;
  var j = focus, st = stateAt(j, jt(j));
  if (!st || !active.length || active.indexOf(j) < 0) { el.style.display = 'none'; return; }
  el.style.display = '';
  var dotH = '<span class="dot" style="background:' + j.colour + '"></span>';
  if (st.before) el.innerHTML = dotH + 'Sets out ' + esc(fmt(j.t0)) + ' <em>from ' + esc(j.pts[0][5] || '') + '</em>';
  else if (st.after) el.innerHTML = dotH + 'Journey over, ' + esc(fmt(j.t1)) + ' <em>· ' + j.km.toLocaleString('en-AU') + ' km</em>';
  else if (st.held) {
    var n = Math.floor(jt(j) - st.held.a) + 1, of = Math.round(st.held.b - st.held.a);
    el.innerHTML = dotH + 'Held at ' + esc(st.held.place) + ' <em>– ' + esc(st.held.why) + ' (day ' + n + ' of ' + of + ')</em>';
  } else el.innerHTML = dotH + 'Day ' + Math.floor(jt(j) - j.t0 + 1) + (st.place ? ' · near ' + esc(st.place) : '') + ' <em>· ' + st.km.toLocaleString('en-AU') + ' km so far</em>';
}
cardEl.addEventListener('click', function (e) {
  var b = e.target.closest('button');
  var drop = e.target.closest('[data-drop]');
  if (drop) { toggleJourney(drop.dataset.drop); return; }
  var fb = e.target.closest('[data-focus]');
  if (fb) { focus = BYID[fb.dataset.focus]; renderCard(); tickUI(); return; }
  if (!b) return;
  if (b.classList.contains('close')) { closeCard(); return; }
  if (b.dataset.align != null) { setAlign(b.dataset.align === '1'); return; }
  if (b.dataset.map) { toggleMap(b.dataset.map); return; }
  if (b.dataset.feed) {
    var fp = b.dataset.feed.split('|'), fj = BYID[fp[0]], fc = fj.calls[+fp[1]]; stopPlay();
    story = { j: fj, c: fc }; now = clamp(fc.t - off(fj), T0, T1); renderCard(); tickUI();
    cardEl.scrollTop = 0;
    return;
  }
  if (b.dataset.story != null) {
    var c = focus.calls[+b.dataset.story]; stopPlay();
    now = clamp(c.t - off(focus), T0, T1); openStory(focus, c); tickUI();
    if (c.lat != null && !visible([c.lon, c.lat])) flyTo([-c.lon, -c.lat], zoom);
  }
});

cardEl.addEventListener('input', function (e) {
  if (e.target.id === 'mapfade') { mapAlpha = +e.target.value; scheduleDraw(); }
});

/* ------------------------------------------------------------ sound */
var soundKey = '';
function soundTick() {
  if (!window.NVSound) return;
  var j = focus && active.indexOf(focus) >= 0 ? focus : active[0], st = j ? stateAt(j, jt(j)) : null;
  var moving = !!(playing && st && !st.before && !st.after && !st.held);
  var k = [playing, j ? j.kind : '', !!(st && st.held), moving].join();
  if (k === soundKey) return; soundKey = k;
  NVSound.update({ playing: playing, kind: j ? j.kind || 'sea' : null, held: !!(st && st.held), moving: moving });
}
['music', 'sfx'].forEach(function (id) {
  var b = document.getElementById(id);
  if (!window.NVSound) { b.style.display = 'none'; return; }
  b.addEventListener('click', function () {
    NVSound.start();
    var on = !b.classList.contains('on'); b.classList.toggle('on', on);
    if (id === 'music') NVSound.setMusic(on); else NVSound.setEffects(on);
    soundKey = ''; soundTick();
  });
});

/* ------------------------------------------------------------ links */
function updateHash() {
  var h = activeSet ? 's=' + activeSet.id : active.length ? 'j=' + active.map(function (j) { return j.id; }).join(',') + (aligned() ? '&align=1' : '') : '';
  if (h && active.length) h += '&t=' + isoOf(now);
  try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) {}
}
function fromHash() {
  var q = {}; location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) q[p[0]] = decodeURIComponent(p[1] || ''); });
  var t = q.t && /^-?\d{3,4}-\d\d-\d\d$/.test(q.t) ? day(q.t) : null;
  if (q.s) selectSet(q.s, t);
  else if (q.j && q.j.indexOf(',') > 0) selectList(q.j.split(',').map(function (i) { return BYID[i]; }), t, q.align === '1');
  else if (q.j && BYID[q.j]) selectJourney(q.j, t);
}

/* ------------------------------------------------------------ test hook */
window.NV = {
  journeys: function () { return JOURNEYS.map(function (j) { return j.id; }); },
  select: function (id, iso) { activeSet = null; selectJourney(id, iso ? day(iso) : null); },
  selectMany: function (ids, iso, al) { activeSet = null; selectList(ids.map(function (i) { return BYID[i]; }), iso ? day(iso) : null, al); },
  toggle: toggleJourney, align: setAlign, active: function () { return active.map(function (j) { return j.id; }); },
  search: function (q) { var el = document.getElementById('q'); el.value = q; query = q; renderList(); return Array.prototype.map.call(document.querySelectorAll('#jlist .jrow[data-id]'), function (b) { return b.dataset.id; }); },
  order: function (o) { document.querySelector('#list .tabs [data-order=' + o + ']').click(); },
  rotation: function () { return rotation.slice(); }, view: function () { return { cx: CX, cy: CY, r: R0 * zoom }; }, following: function () { return follow; },
  selectSet: function (id, iso) { selectSet(id, iso ? day(iso) : null); },
  showAll: showAll,
  setDate: function (iso) { now = clamp(day(iso), T0, T1); tickUI(); },
  date: function () { return isoOf(now); },
  setView: function (lon, lat, z) { fly = null; rotation = [-lon, -lat]; if (z) zoom = z; scheduleDraw(); },
  play: startPlay, stop: stopPlay, playing: function () { return playing; },
  state: function (id) { var s = stateAt(BYID[id], jt(BYID[id])); return s && { ll: s.ll, held: !!s.held, km: s.km, i: s.i, place: s.place }; },
  drawMs: function () { draw(); return lastDrawMs; },
  renderer: function () { return GL ? 'webgl' : '2d'; },
  ready: function () { return texturesReady; },
  story: function () { return story && story.c ? story.c.title : null; },
  maps: function (id) { return id ? mapsFor(BYID[id]).map(function (m) { return m.id; }) : MAPS.map(function (m) { return m.id; }); },
  toggleMap: toggleMap
};

window.addEventListener('resize', resize);
renderList();
resize();
loadTextures();
fromHash();
tickUI();
})();
</script>
